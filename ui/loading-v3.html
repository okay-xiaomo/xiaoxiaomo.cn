<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在加载 - UniHalo Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 点状背景 */
        .bg-dots {
            background-image: radial-gradient(#d1d5db 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* 模仿原图的波浪线 */
        .squiggly-line {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 4"><path d="M0 3.5c5 0 5-3 10-3s5 3 10 3" fill="none" stroke="%235B92FF" stroke-width="1.5"/></svg>') repeat-x bottom;
            background-size: 15px 4px;
            padding-bottom: 6px;
        }

        /* 整体卡片漂浮动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* 方块小人跳动 */
        @keyframes character-jump {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            50% { transform: translateY(-20px) scale(1.1, 0.9); }
        }
        .animate-jump {
            animation: character-jump 0.6s infinite alternate ease-in-out;
        }

        /* 进度条动画 */
        @keyframes loading-bar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .loading-fill {
            animation: loading-bar 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-[#f3f4f6] bg-dots min-h-screen flex flex-col items-center justify-center font-bold text-black overflow-hidden">
 
    <!-- 主卡片容器 -->
    <div class="relative animate-float">
        
        <!-- 背景阴影 -->
        <div class="absolute inset-0 bg-black translate-x-3 translate-y-3 rounded-[40px]"></div>

        <!-- 主体卡片 -->
        <div class="relative bg-white border-[4px] border-black rounded-[40px] p-10 md:p-14 flex flex-col items-center w-[350px] md:w-[500px]">
            
            <!-- 动态方块小人 (来自版本二) -->
            <div class="relative mb-10">
                <div class="w-24 h-24 bg-[#00D26A] border-[5px] border-black rounded-2xl flex flex-col items-center justify-center animate-jump shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
                    <div class="flex gap-4 mb-2">
                        <div class="w-3 h-3 bg-black rounded-full"></div>
                        <div class="w-3 h-3 bg-black rounded-full"></div>
                    </div>
                    <div class="w-8 h-2 bg-black rounded-full"></div>
                </div>
                <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-16 h-2 bg-black/10 rounded-full"></div>
            </div>

            <!-- 设计感文案 (来自版本二) -->
            <div class="flex flex-col items-center gap-3 mb-8">
                <div class="flex items-center gap-2">
                    <span class="text-3xl md:text-4xl">正在</span>
                    <div class="bg-[#FF85A2] border-[3px] border-black px-4 py-1 -rotate-2 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                        <span class="text-white text-3xl md:text-4xl italic">疯狂</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="bg-[#5B92FF] border-[3px] border-black px-6 py-1 rotate-1 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                        <span class="text-white text-3xl md:text-4xl">载入资源</span>
                    </div>
                </div>
            </div>

            <!-- 副标题带波浪线 -->
            <p class="text-lg text-gray-600 mb-10">
                <span class="squiggly-line font-medium">请稍等，精彩马上就来...</span>
            </p>

            <!-- 进度条 (保留版本一逻辑，视觉优化) -->
            <div class="w-full h-10 bg-white border-[4px] border-black rounded-xl overflow-hidden relative">
                <div class="h-full bg-[#FFD600] border-r-4 border-black loading-fill relative">
                    <!-- 进度条内部斜纹 -->
                    <div class="absolute inset-0 opacity-10" style="background: repeating-linear-gradient(45deg, #000, #000 10px, transparent 10px, transparent 20px);"></div>
                </div>
            </div>
        </div>

        <!-- 装饰性贴纸 -->

          <!-- 顶部装饰标签 (模拟图片中的 "了解我的故事" 标签) -->
            <div class="absolute -top-6 left-10 bg-[#FFD600] border-4 border-black px-4 py-1 rounded-full shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] text-sm">
                SYSTEM BOOTING...
            </div>

        <!-- 左侧粉色笑脸 -->
        <div class="absolute -left-10 -bottom-10 w-24 h-24 bg-[#FF85A2] border-4 border-black rounded-full flex items-center justify-center shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] rotate-[-15deg]">
             <div class="flex flex-col items-center">
                 <div class="flex gap-3 mb-1">
                     <div class="w-2 h-2 bg-black rounded-full"></div>
                     <div class="w-2 h-2 bg-black rounded-full"></div>
                 </div>
                 <div class="w-8 h-4 border-b-4 border-black rounded-full"></div>
             </div>
        </div>

          <!-- 右侧二维码/条码风格装饰 -->
        <div class="absolute -right-8 top-10 bg-white border-4 border-black p-2 rounded-xl rotate-12 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
            <div class="flex gap-1">
                <div class="w-1 h-8 bg-black"></div>
                <div class="w-2 h-8 bg-black"></div>
                <div class="w-1 h-8 bg-black"></div>
                <div class="w-3 h-8 bg-black"></div>
                <div class="w-1 h-8 bg-black"></div>
            </div>
        </div>

        <!-- 右侧 AI + VIBE 标签 -->
        <div class="absolute -right-8 -bottom-4 bg-[#00D26A] border-4 border-black px-4 py-2 rounded-full rotate-12 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex flex-col items-center">
            <span class="text-[10px] leading-none uppercase">Xiaomo</span>
            <span class="text-xs">AI + VIBE</span>
        </div>
    </div>

    <!-- 背景装饰碎片 (版本一风格) -->
    <div class="fixed top-1/4 left-10 w-6 h-6 bg-[#5B92FF] border-2 border-black rotate-12 hidden md:block opacity-40"></div>
    <div class="fixed bottom-1/4 right-10 w-8 h-8 bg-[#FFD600] border-2 border-black rounded-lg -rotate-12 hidden md:block opacity-40"></div>
    <div class="fixed top-3/4 left-20 w-4 h-4 bg-[#FF85A2] border-2 border-black rounded-full hidden md:block opacity-40"></div>

</body>
</html>

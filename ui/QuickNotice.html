<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinned Notice Card - Neo-brutalism</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 保持原有的波点背景，提供物理墙面的隐喻 */
        .dot-bg {
            background-color: #f4f4f5;
            background-image: radial-gradient(#d4d4d8 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="dot-bg min-h-screen flex items-center justify-center p-4 font-sans text-gray-900 overflow-hidden">

    <!-- 
      公告小卡片容器 
      使用 origin-top 让旋转动画以顶部（图钉位置）为轴心
      rotate-2: 初始轻微倾斜
      hover:-rotate-1: 悬停时产生物理晃动感
    -->
    <div class="relative w-full max-w-[320px] bg-[#fff9c4] border-[4px] border-black p-5 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] rounded-xl rotate-2 hover:-rotate-1 origin-top transition-transform duration-300 ease-in-out z-10">
        
        <!-- ==================== 图钉设计 (Pushpin) ==================== -->
        <!-- 包含图钉头和模拟刺穿纸张的小黑洞 -->
        <div class="absolute -top-6 left-1/2 -translate-x-1/2 flex flex-col items-center z-20">
            <!-- 图钉主体 -->
            <div class="w-10 h-10 bg-[#ff4a4a] rounded-full border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] relative flex items-center justify-center z-10 cursor-pointer hover:bg-[#ff2020] transition-colors">
                <!-- 图钉左上角的高光 (反光) -->
                <div class="absolute top-1.5 left-1.5 w-2.5 h-2.5 bg-white rounded-full opacity-80"></div>
                <!-- 图钉中心的凹陷感圆点 -->
                <div class="w-2 h-2 bg-black rounded-full opacity-20"></div>
            </div>
            <!-- 图钉的针刺穿纸张留下的“洞/阴影” -->
            <div class="w-2 h-2 bg-black rounded-full -mt-2 opacity-80"></div>
        </div>
        <!-- ========================================================== -->

        <!-- 顶部标签 -->
        <div class="mt-4 mb-3 flex justify-center">
            <span class="bg-[#a855f7] text-white px-3 py-1 border-[2.5px] border-black rounded-md text-xs font-black tracking-wider uppercase shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] rotate-[-2deg]">
                HOT UPDATE
            </span>
        </div>

        <!-- 紧凑型图文区：图片占位 -->
        <!-- 使用了明亮的青色作为背景 -->
        <div class="w-full aspect-[4/3] bg-[#06b6d4] border-[3px] border-black rounded-lg shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] overflow-hidden relative group mb-4 flex items-center justify-center cursor-pointer">
            <div class="text-center group-hover:scale-110 transition-transform duration-200">
                <svg class="w-10 h-10 mx-auto text-black" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
        </div>

        <!-- 文本内容区 -->
        <div class="text-center mb-4">
            <h2 class="text-xl font-black mb-2 text-black leading-tight">
                全新的闪电功能
            </h2>
            <p class="text-sm font-bold text-gray-700 leading-snug">
                系统渲染速度提升 300%，一键开启你的极速体验之旅。
            </p>
        </div>

        <!-- 底部：小巧的 CTA 按钮 -->
        <button class="w-full bg-[#fcdc4d] text-black border-[3px] border-black rounded-lg py-2.5 font-black text-sm shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] transition-all hover:bg-[#fbbf24] hover:-translate-y-0.5 hover:shadow-[5px_5px_0px_0px_rgba(0,0,0,1)] active:translate-y-0.5 active:shadow-none flex items-center justify-center gap-2">
            立刻升级
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
        </button>

        <!-- 装饰：右下角小折角效果的替代方案（用几条横线模拟纸张质感） -->
        <div class="absolute bottom-2 right-2 flex flex-col gap-1 opacity-20">
            <div class="w-4 h-[2px] bg-black"></div>
            <div class="w-2 h-[2px] bg-black ml-auto"></div>
        </div>

    </div>

</body>
</html>

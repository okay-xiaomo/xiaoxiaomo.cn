<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Signpost Cluster - Neo-brutalism</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 户外天空波点背景 */
        .sky-dot-bg {
            background-color: #f0fdf4; /* 淡绿偏白底色，清新感 */
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 32px 32px;
        }
        /* 自定义摇摆动画 */
        @keyframes swing {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }
        .animate-swing {
            transform-origin: top center;
            animation: swing 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="sky-dot-bg min-h-screen flex items-end justify-center pb-0 p-4 font-sans overflow-hidden">

    <!-- 
      路标集群主容器
      设定了足够的高度以容纳所有牌子
    -->
    <div class="relative w-full max-w-[800px] h-[750px] flex justify-center mt-10 z-10">

        <!-- ==================== 0. 环境构建 ==================== -->
        
        <!-- 草地/土丘 Base -->
        <div class="absolute bottom-0 w-[150%] h-24 bg-[#22c55e] border-[4px] border-black rounded-t-[50%] shadow-[0px_-6px_0px_0px_rgba(0,0,0,0.1)_inset] z-20 flex justify-center">
            <!-- 草地细节 -->
            <div class="absolute top-4 w-12 h-2 bg-black rounded-full opacity-20 -ml-40"></div>
            <div class="absolute top-8 w-8 h-2 bg-black rounded-full opacity-20 ml-60"></div>
        </div>

        <!-- 核心主干木桩 Central Pole -->
        <!-- 所有的牌子都“挂”在这根柱子上 -->
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-10 h-[650px] bg-[#b45309] border-[4px] border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] z-10 rounded-t-lg flex flex-col items-center pt-10 gap-20">
            <!-- 木纹模拟 -->
            <div class="w-full h-1 bg-black opacity-30 mt-10"></div>
            <div class="w-full h-1 bg-black opacity-30 mt-32"></div>
            <div class="w-full h-1 bg-black opacity-30 mt-24"></div>
        </div>


        <!-- ==================== 1. 顶牌 (胶囊形 / The Pill) ==================== -->
        <!-- 位于最高处，通常用于核心 Slogan 或 起点 -->
        <div class="absolute top-6 left-1/2 -translate-x-1/2 bg-[#a855f7] border-[4px] border-black rounded-full px-8 py-3 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] z-30 hover:-translate-y-1 transition-transform cursor-pointer">
            <!-- 钉在木桩上的两颗钉子 -->
            <div class="absolute left-4 top-1/2 -translate-y-1/2 w-3 h-3 bg-gray-300 border-[2px] border-black rounded-full"></div>
            <div class="absolute right-4 top-1/2 -translate-y-1/2 w-3 h-3 bg-gray-300 border-[2px] border-black rounded-full"></div>
            
            <h1 class="text-white font-black text-xl tracking-widest uppercase">Start Here</h1>
        </div>


        <!-- ==================== 2. 左侧指路牌 (单侧倒角 / Directional Arrow) ==================== -->
        <!-- 指向左侧，带有一点倾斜，带有明确的行动指引 -->
        <!-- 通过 right-1/2 和 marginRight 将其固定在木桩左侧 -->
        <div class="absolute top-[120px] right-1/2 mr-3 bg-[#fcdc4d] border-[4px] border-black p-4 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] z-20 rotate-[-4deg] hover:rotate-0 transition-transform origin-right w-[240px] cursor-pointer group rounded-l-3xl rounded-r-md">
            
            <!-- 固定螺丝 (贴近木桩那一侧) -->
            <div class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 bg-gray-400 border-[2px] border-black rounded-full shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] flex justify-center items-center"><div class="w-2 h-0.5 bg-black rotate-45"></div></div>

            <div class="flex items-center justify-between pr-6 pl-2">
                <!-- 指示箭头 -->
                <svg class="w-10 h-10 text-black group-hover:-translate-x-2 transition-transform" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <div class="text-right">
                    <h2 class="text-2xl font-black text-black uppercase">Projects</h2>
                    <p class="text-xs font-bold text-gray-700">探索开源项目</p>
                </div>
            </div>
        </div>


        <!-- ==================== 3. 右侧主展板 (大图文 / The Billboard) ==================== -->
        <!-- 面积最大，用于核心信息展示 -->
        <!-- 通过 left-1/2 和 marginLeft 将其固定在木桩右侧 -->
        <div class="absolute top-[220px] left-1/2 ml-3 bg-white border-[4px] border-black p-5 shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] z-20 rotate-[2deg] hover:-translate-y-2 hover:rotate-[1deg] transition-all duration-300 w-[320px] origin-left rounded-xl">
            
            <!-- 固定螺丝 (上下各一个) -->
            <div class="absolute left-3 top-4 w-4 h-4 bg-gray-400 border-[2px] border-black rounded-full shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]"></div>
            <div class="absolute left-3 bottom-4 w-4 h-4 bg-gray-400 border-[2px] border-black rounded-full shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]"></div>

            <div class="pl-8">
                <div class="bg-[#2cd06b] border-[3px] border-black w-full h-24 mb-3 rounded-lg overflow-hidden flex items-center justify-center relative">
                    <span class="font-black text-black bg-white px-2 py-1 border-[2px] border-black rounded rotate-[-5deg]">ABOUT ME</span>
                </div>
                <h3 class="text-xl font-black leading-tight mb-2">全栈开发工程师<br><span class="text-[#4d90fe]">& UI 设计师</span></h3>
                <p class="text-sm font-bold text-gray-600 mb-4 line-clamp-2">致力于打造兼具硬核工程质感与优秀视觉体验的产品。</p>
                <button class="bg-black text-white px-4 py-2 border-[2px] border-black rounded-lg font-bold text-sm shadow-[3px_3px_0px_0px_rgba(0,0,0,0.5)] hover:bg-gray-800 active:translate-y-1 active:shadow-none transition-all">
                    了解更多
                </button>
            </div>

            <!-- ==================== 4. 悬挂吊牌 (子附牌 / The Hanging Tag) ==================== -->
            <!-- 挂在主展板下方，通过纯CSS实现“链条”和摇摆动画 -->
            <div class="absolute -bottom-[65px] right-10 flex flex-col items-center animate-swing">
                <!-- 挂绳/铁链 -->
                <div class="flex gap-10">
                    <div class="w-1.5 h-6 bg-black"></div>
                    <div class="w-1.5 h-6 bg-black"></div>
                </div>
                <!-- 吊牌主体 -->
                <div class="bg-[#ff6b9e] border-[3px] border-black px-4 py-1 rounded shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center gap-2">
                    <span class="w-2.5 h-2.5 bg-[#fcdc4d] border-[2px] border-black rounded-full animate-pulse"></span>
                    <span class="font-black text-sm uppercase">Open to Work</span>
                </div>
            </div>
        </div>


        <!-- ==================== 5. 独立低位警告牌 (地面彩蛋 / Ground Sign) ==================== -->
        <!-- 独立插在地上的小牌子，打破单一木桩的呆板感 -->
        <div class="absolute bottom-[80px] left-[15%] z-30 group cursor-pointer">
            <!-- 小木棍基座 -->
            <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-3 h-20 bg-[#78350f] border-[3px] border-black z-10 rounded-t-sm"></div>
            
            <!-- 菱形警告牌主体 (通过外层旋转实现) -->
            <div class="relative z-20 rotate-[-15deg] group-hover:rotate-0 transition-transform duration-300 -translate-y-8">
                <!-- 实际的方块 -->
                <div class="w-24 h-24 bg-white border-[4px] border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center p-2 relative">
                    <!-- 内部警戒条纹边框 -->
                    <div class="w-full h-full border-[3px] border-dashed border-[#ef4444] flex flex-col items-center justify-center bg-white p-1">
                        <svg class="w-8 h-8 text-[#ef4444] mb-1" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <span class="font-black text-[10px] uppercase text-black leading-none">BETA</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>

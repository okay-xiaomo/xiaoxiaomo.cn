<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阿偶，正在跳转中...</title>
  <script>
    // GitHub Pages 404 路由 fallback 方案（BrowserRouter 模式）
    // 访问 /xxx 时 GitHub Pages 会返回本页；本脚本将用户重定向到根路径
    // 并带上 redirect 参数，让 React Router 在客户端导航到 /not-found。
    const origin = window.location.origin;
    const redirectPath = '/not-found';

    if (window.location.pathname === '/' || window.location.search.includes('redirect=')) {
      window.location.replace(`${origin}/`);
    } else {
      window.location.replace(`${origin}/?redirect=${encodeURIComponent(redirectPath)}`);
    }
  </script>
</head>
<body>
  <p>页面不存在，正在跳转到 /not-found ...</p>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站维护中 | 施工涂鸦</title>
    
    <!-- 引入外部手写字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    
    <!-- 1. Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <!-- 2. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'handwriting': ['"Zhi Mang Xing"', 'cursive'],
                        'doodle': ['"Comic Neue"', 'cursive', 'sans-serif'],
                    },
                    colors: {
                        'ink-black': '#1a202c',
                        'warning-yellow': '#fcd34d',
                        'blueprint-blue': '#e0f2fe',
                        'tape-color': '#fef08a'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden; /* 阻止滚动，聚焦当前视口 */
            font-family: 'Comic Neue', sans-serif;
            background-color: #f8fafc;
            /* 工程师图纸网格背景 */
            background-image: 
                linear-gradient(#cbd5e1 1px, transparent 1px),
                linear-gradient(90deg, #cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
            cursor: crosshair;
        }
        
        /* 手绘硬阴影 */
        .sketch-shadow {
            box-shadow: 8px 8px 0 0 #1a202c;
            border: 4px solid #1a202c;
        }

        /* 斑马线施工条纹 */
        .construction-stripes {
            background: repeating-linear-gradient(
                45deg,
                #fcd34d,
                #fcd34d 10px,
                #1a202c 10px,
                #1a202c 20px
            );
        }

        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15; /* 降低透明度，作为低调的背景 */
        }
    </style>
</head>
<body>

    <!-- Three.js 渲染层 (背景3D齿轮) -->
    <div id="three-canvas"></div>

    <!-- 背景2D涂鸦装饰 (Anime.js 将使其旋转/浮动) -->
    <div class="fixed inset-0 pointer-events-none z-0" id="doodle-layer">
        <!-- 齿轮1 -->
        <svg class="anime-gear absolute top-10 left-10 w-24 h-24 text-ink-black opacity-30" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <!-- 齿轮2 -->
        <svg class="anime-gear absolute bottom-20 right-10 w-32 h-32 text-ink-black opacity-20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <!-- 扳手 -->
        <svg class="anime-float absolute top-1/4 right-1/4 w-16 h-16 text-ink-black opacity-30" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
    </div>

    <!-- Vue 应用 (主内容区) -->
    <div id="app" class="relative z-10 min-h-screen flex items-center justify-center p-4">
        
        <!-- 主公告牌容器 -->
        <div id="board-container" class="relative w-full max-w-3xl">
            
            <!-- 顶部的封箱胶带 -->
            <div class="absolute -top-6 left-1/2 -translate-x-1/2 w-48 h-10 bg-tape-color opacity-90 rotate-2 border-2 border-ink-black z-20 shadow-md transform skew-x-12 flex items-center justify-center">
                <span class="text-ink-black font-bold tracking-widest opacity-50 uppercase text-xs">Do Not Cross</span>
            </div>

            <!-- 公告牌主体 -->
            <div class="bg-white sketch-shadow rounded-sm p-6 sm:p-10 -rotate-1 relative overflow-hidden">
                
                <!-- 顶部斑马线装饰条 -->
                <div class="absolute top-0 left-0 w-full h-3 construction-stripes"></div>

                <!-- 标题区域 -->
                <div class="text-center mt-4 mb-8">
                    <div class="inline-block animate__animated animate__pulse animate__infinite animate__slow">
                        <span class="text-5xl sm:text-6xl">🚧</span>
                    </div>
                    <h1 class="font-handwriting text-5xl sm:text-6xl font-bold text-ink-black mt-4 mb-2 tracking-wide">
                        网站升级维护中
                    </h1>
                    <p class="text-xl text-gray-600 font-doodle border-b-2 border-dashed border-gray-300 pb-4 inline-block">
                        "系统正在进行史诗级重构..."
                    </p>
                </div>

                <!-- 内容区：两列布局 (移动端单列) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    
                    <!-- 左侧：动态状态播报 -->
                    <div class="flex flex-col justify-center border-4 border-ink-black p-4 bg-blueprint-blue relative transform rotate-1">
                        <div class="absolute -top-3 -left-3 bg-warning-yellow border-2 border-ink-black px-2 py-1 text-sm font-bold shadow-[2px_2px_0_0_#1a202c]">
                            施工播报
                        </div>
                        <div class="flex items-center gap-3 mt-2">
                            <span class="text-2xl animate__animated animate__spin animate__infinite animate__slower">⚙️</span>
                            <!-- Vue动态绑定的状态文本 -->
                            <p class="font-bold text-lg text-ink-black transition-all duration-300" :key="statusText">
                                {{ statusText }}
                            </p>
                        </div>
                    </div>

                    <!-- 右侧：倒计时 -->
                    <div class="flex flex-col justify-center items-center">
                        <p class="font-bold text-ink-black mb-3 bg-warning-yellow px-2 border-2 border-ink-black inline-block transform -rotate-2">
                            预计重新开放时间
                        </p>
                        
                        <!-- 涂鸦风倒计时框 -->
                        <div class="flex gap-2 text-center font-handwriting">
                            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white border-4 border-ink-black flex flex-col justify-center items-center shadow-[4px_4px_0_0_#1a202c]">
                                <span class="text-3xl sm:text-4xl font-bold">{{ hours }}</span>
                                <span class="text-xs font-sans font-bold uppercase mt-1">时</span>
                            </div>
                            <span class="text-3xl font-bold self-center animate__animated animate__flash animate__infinite animate__slower">:</span>
                            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white border-4 border-ink-black flex flex-col justify-center items-center shadow-[4px_4px_0_0_#1a202c]">
                                <span class="text-3xl sm:text-4xl font-bold">{{ minutes }}</span>
                                <span class="text-xs font-sans font-bold uppercase mt-1">分</span>
                            </div>
                            <span class="text-3xl font-bold self-center animate__animated animate__flash animate__infinite animate__slower">:</span>
                            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white border-4 border-ink-black flex flex-col justify-center items-center shadow-[4px_4px_0_0_#1a202c] text-red-500">
                                <span class="text-3xl sm:text-4xl font-bold">{{ seconds }}</span>
                                <span class="text-xs font-sans font-bold text-ink-black uppercase mt-1">秒</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 底部互动提示 -->
                <div class="mt-8 text-center text-sm text-gray-400 border-t-2 border-ink-black pt-4 border-dotted">
                    无聊的话，点击屏幕任何地方帮忙“电焊” ⚡
                </div>

            </div>
        </div>
    </div>

    <!-- 引入外部 JS 库 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mojs/core"></script>

    <script>
        // ==========================================
        // 1. Vue 3: 倒计时 & 施工状态轮播
        // ==========================================
        const { createApp, ref, onMounted, onUnmounted } = Vue;

        createApp({
            setup() {
                // 倒计时逻辑
                const hours = ref('03');
                const minutes = ref('20');
                const seconds = ref('00');
                let timer = null;
                const targetTime = new Date().getTime() + (3 * 60 * 60 * 1000) + (20 * 60 * 1000);

                const updateTime = () => {
                    const distance = targetTime - new Date().getTime();
                    if (distance < 0) return clearInterval(timer);
                    hours.value = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                    minutes.value = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    seconds.value = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
                };

                // 状态文本轮播逻辑
                const statusMessages = [
                    "正在给服务器喂双倍浓缩咖啡...",
                    "正在努力驱赶代码里的Bug...",
                    "正在重绘每一个像素点...",
                    "工程师的头发又少了几根...",
                    "正在重新连接宇宙信号..."
                ];
                const statusText = ref(statusMessages[0]);
                let statusTimer = null;
                let statusIndex = 0;

                onMounted(() => {
                    updateTime();
                    timer = setInterval(updateTime, 1000);
                    // 每 3.5 秒切换一次状态文本
                    statusTimer = setInterval(() => {
                        statusIndex = (statusIndex + 1) % statusMessages.length;
                        statusText.value = statusMessages[statusIndex];
                    }, 3500);
                });

                onUnmounted(() => {
                    clearInterval(timer);
                    clearInterval(statusTimer);
                });

                return { hours, minutes, seconds, statusText };
            }
        }).mount('#app');

        // ==========================================
        // 2. GSAP: 公告牌重力入场动画
        // ==========================================
        gsap.from("#board-container", {
            duration: 1.8,
            y: -1000,
            rotation: -15,
            ease: "elastic.out(1, 0.4)", // 弹性阻尼效果，像钉在墙上
            delay: 0.1
        });

        // ==========================================
        // 3. Three.js: 底层 3D 线框齿轮/模块重构隐喻
        // ==========================================
        const initThreeJS = () => {
            const container = document.getElementById('three-canvas');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 使用黑色线框表现蓝图/手绘稿的结构感
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x1a202c, 
                wireframe: true,
                wireframeLinewidth: 1.5
            });

            // 对象1: 环面纽结 (复杂的结构)
            const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(12, 3, 100, 16), material);
            knot.position.set(-25, 5, -40);
            scene.add(knot);

            // 对象2: 大圆环 (像基础齿轮)
            const torus = new THREE.Mesh(new THREE.TorusGeometry(15, 2, 16, 100), material);
            torus.position.set(30, -10, -50);
            scene.add(torus);

            camera.position.z = 30;

            const animate = function () {
                requestAnimationFrame(animate);
                // 缓慢旋转体现“机器正在底层运行”
                knot.rotation.x += 0.002;
                knot.rotation.y += 0.003;
                torus.rotation.x -= 0.001;
                torus.rotation.y -= 0.002;
                renderer.render(scene, camera);
            };
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };
        initThreeJS();

        // ==========================================
        // 4. Anime.js: 2D 涂鸦元素的旋转与漂浮
        // ==========================================
        // 让齿轮持续旋转
        anime({
            targets: '.anime-gear',
            rotate: 360,
            duration: 8000,
            easing: 'linear',
            loop: true
        });
        
        // 让扳手上下漂浮
        anime({
            targets: '.anime-float',
            translateY: [-15, 15],
            rotate: [-10, 10],
            duration: 3000,
            direction: 'alternate',
            loop: true,
            easing: 'easeInOutSine'
        });

        // ==========================================
        // 5. Mo.js: 互动彩蛋 - 点击屏幕产生“电焊火花”
        // ==========================================
        // 定义火花四溅的动画效果
        const sparkBurst = new mojs.Burst({
            radius: { 0: 60 },
            count: 6,
            children: {
                shape: 'line',
                stroke: ['#fcd34d', '#ef4444', '#1a202c'], // 黄、红、黑
                strokeWidth: { 4: 0 },
                radius: { 15: 0 },
                angle: { 360: 0 },
                duration: 600,
                easing: 'cubic.out'
            }
        });

        // 定义伴随的小飞溅粒子
        const dustBurst = new mojs.Burst({
            radius: { 0: 80 },
            count: 4,
            children: {
                shape: 'circle',
                fill: '#1a202c',
                radius: { 6: 0 },
                duration: 800,
                delay: 100,
                easing: 'quad.out'
            }
        });

        document.addEventListener('click', function (e) {
            // 在鼠标点击位置播放 Mo.js 动画
            sparkBurst.tune({ x: e.pageX, y: e.pageY }).replay();
            dustBurst.tune({ x: e.pageX, y: e.pageY }).replay();
        });

    </script>
</body>
</html>

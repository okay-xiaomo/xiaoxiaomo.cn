<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在加载中...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 点状背景 */
        .bg-dots {
            background-image: radial-gradient(#d1d5db 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* 模拟手账的抖动动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* 进度条动画 */
        @keyframes loading-bar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .loading-fill {
            animation: loading-bar 2s infinite ease-in-out;
        }

        /* 贴纸旋转 */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 6s linear infinite;
        }
    </style>
</head>
<body class="bg-[#f3f4f6] bg-dots min-h-screen flex items-center justify-center font-bold">

    <!-- 主卡片容器 -->
    <div class="relative animate-float">
        
        <!-- 背景阴影装饰 (模拟手账层的重叠感) -->
        <div class="absolute inset-0 bg-black translate-x-3 translate-y-3 rounded-[40px]"></div>

        <!-- 主体卡片 -->
        <div class="relative bg-white border-[4px] border-black rounded-[40px] p-8 md:p-12 flex flex-col items-center w-[350px] md:w-[450px]">
            
            <!-- 顶部装饰标签 (模拟图片中的 "了解我的故事" 标签) -->
            <div class="absolute -top-6 left-10 bg-[#FFD600] border-4 border-black px-4 py-1 rounded-full shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] text-sm">
                SYSTEM BOOTING...
            </div>

            <!-- 核心图标区域 (模拟 ID 卡风格) -->
            <div class="w-32 h-32 bg-[#5B92FF] border-4 border-black rounded-3xl mb-6 relative overflow-hidden flex items-center justify-center">
                <!-- 内部动效 -->
                <div class="text-white text-5xl animate-bounce">
                    🚀
                </div>
                <!-- 装饰线条 -->
                <div class="absolute bottom-0 w-full h-4 bg-black/20"></div>
            </div>

            <!-- 标题文字 -->
            <h1 class="text-3xl mb-2 text-black tracking-tight">正在加载资源</h1>
            <p class="text-gray-500 mb-8 font-medium">请稍等，精彩马上就来...</p>

            <!-- 进度条容器 -->
            <div class="w-full h-10 bg-white border-4 border-black rounded-xl overflow-hidden relative">
                <!-- 进度条填充 -->
                <div class="h-full bg-[#00D26A] border-r-4 border-black loading-fill"></div>
            </div>

            <!-- 底部小贴士 -->
            <div class="mt-8 flex gap-3">
                <div class="bg-[#FF85A2] border-2 border-black px-3 py-1 rounded-lg shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] text-xs">
                    # 手账风格
                </div>
                <div class="bg-white border-2 border-black px-3 py-1 rounded-lg shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] text-xs">
                    # UniHalo
                </div>
            </div>
        </div>

        <!-- 装饰性贴纸 (卡片外部) -->
        <!-- 左侧圆环 -->
        <div class="absolute -left-12 -bottom-8 w-20 h-20 bg-[#FF85A2] border-4 border-black rounded-full flex items-center justify-center shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] animate-spin-slow">
             <span class="text-2xl">😊</span>
        </div>

        <!-- 右侧二维码/条码风格装饰 -->
        <div class="absolute -right-8 top-10 bg-white border-4 border-black p-2 rounded-xl rotate-12 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
            <div class="flex gap-1">
                <div class="w-1 h-8 bg-black"></div>
                <div class="w-2 h-8 bg-black"></div>
                <div class="w-1 h-8 bg-black"></div>
                <div class="w-3 h-8 bg-black"></div>
                <div class="w-1 h-8 bg-black"></div>
            </div>
        </div>
    </div>

    <!-- 屏幕随机散落的点缀 -->
    <div class="fixed top-20 left-20 w-4 h-4 bg-[#5B92FF] border-2 border-black rotate-45 hidden md:block"></div>
    <div class="fixed bottom-20 right-20 w-6 h-6 bg-[#FFD600] border-2 border-black rounded-full hidden md:block"></div>
    <div class="fixed top-1/2 right-10 w-4 h-4 bg-[#00D26A] border-2 border-black hidden md:block"></div>

</body>
</html>
